   1. POSITION: FIXED
   
   - რას აკეთებს: ელემენტს ამაგრებს ეკრანის (Viewport) მიმართ.
   - წარმოსახვა: წარმოიდგინე მინაზე (მონიტორზე) გარედან დაწებებული 
     სტიკერი. გვერდი (Scroll) ზევით-ქვევით რომც ჩამოწიო, ეს ელემენტი 
     ზუსტად იმავე ადგილას რჩება ეკრანზე და არ იძვრის.
   - გამოყენება: Chat-ის ღილაკები, Top Header, Back-to-Top ღილაკი.

.fixed-example {
  position: fixed;
  top: 20px;
  right: 20px;
}
 
   2. POSITION: STICKY
   
   - რას აკეთებს: ჰიბრიდია (position: relative + position: fixed).
   - წარმოსახვა: ჩვეულებრივად მოძრაობს გვერდთან ერთად (როგორც Relative),
     მაგრამ როგორც კი სქროლვისას ეკრანის ზედა/ქვედა ზღვარს (მაგ. top: 0) 
     მიაღწევს, "ეწებება" ეკრანს და ჩერდება იქ, სანამ მშობელი ბლოკი არ დამთავრდება.
   - გამოყენება: ცხრილის სათაურები (Header), ნავიგაციის მენიუ (Navbar).


.sticky-example {
  position: sticky;
  top: 0; /* ეწებება ეკრანის ზედა ნაწილს */
}


 
   3. BACKGROUND-SIZE: COVER
