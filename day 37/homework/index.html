<!--  
==================================================
1. BOX MODEL (ყუთის მოდელი)
==================================================
Box Model არის CSS-ის ფუნდამენტური კონცეფცია. HTML-ის თითოეული ელემენტი 
ბრაუზერში აღიქმება როგორც ოთხკუთხა ყუთი.

Box Model შედგება 4 შრისგან (შიგნიდან გარეთ):
1. Content (შინაარსი): უშუალოდ ტექსტი, სურათი ან შილდ ელემენტები.
2. Padding (შიდა დაშორება): სივრცე კონტენტსა და ჩარჩოს (Border) შორის.
3. Border (ჩარჩო): ხაზი, რომელიც გარს ერტყმის Padding-სა და Content-ს.
4. Margin (გარე დაშორება): სივრცე ჩარჩოს გარეთ, რომელიც ელემენტს აშორებს სხვა ელემენტებისგან.
*/

/* Margin da Padding მაგალითები: */
.box-example {
  /* Margin - ელემენტის გარეთ დაშორება */
  margin-top: 20px;       /* ზემოდან დაშორება */
  margin-right: 15px;     /* მარჯვნიდან დაშორება */
  margin-bottom: 20px;    /* ქვემოდან დაშორება */
  margin-left: 15px;      /* მარცხნიდან დაშორება */
  /* მოკლე ჩანაწერი: margin: 20px 15px; (ზედა/ქვედა | მარჯვენა/მარცხენა) */

  /* Padding - შიდა სივრცე */
  padding-top: 10px;      /* შიდა დაშორება ზემოდან */
  padding-right: 10px;    /* შიდა დაშორება მარჯვნიდან */
  padding-bottom: 10px;   /* შიდა დაშორება ქვემოდან */
  padding-left: 10px;     /* შიდა დაშორება მარცხნიდან */
  /* მოკლე ჩანაწერი: padding: 10px; (ოთხივე მხრიდან) */

  border: 2px solid #000; /*  ჩარჩო  
} -->
