


<!-- Inline  სტილი იწერება უშუალოდ HTML ტეგის შიგნით, style ატრიბუტის გამოყენებით.

მაგალითი: <p style="color: red;">ტექსტი</p>

პლიუსი: სწრაფია პატარა ცვლილების ტესტირებისთვის. ყველაზე მაღალი პრიორიტეტი აქვს.

მინუსი: კოდი ხდება გაუგებარი და რთულად მოსავლელი.

Internal (შიდა / დოკუმენტში): სტილები იწერება იმავე HTML ფაილში, <head> სექციაში განთავსებულ <style> ტეგებს შორის.

მაგალითი: <style> p { color: red; } </style>

პლიუსი: კარგია, თუ მხოლოდ ერთი კონკრეტული HTML გვერდის გასტილვა გინდა.

მინუსი: ზრდის HTML ფაილის ზომას და სხვა გვერდებზე ამ სტილებს ვერ გამოიყენებ.

External (გარე ფაილი): სტილები იწერება სრულიად ცალკე .css ფაილში (მაგ: style.css), რომელიც HTML ფაილს უკავშირდება <link> ტეგის მეშვეობით.

მაგალითი: <link rel="stylesheet" href="style.css">

პლიუსი: ყველაზე სწორი და პროფესიონალური გზაა. ერთი CSS ფაილით შეგიძლია ასობით HTML გვერდი განსტილო, ინარჩუნებს სუფთა კოდს და საიტიც უფრო სწრაფად იტვირთება   -->
