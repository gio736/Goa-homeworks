<!--
   1) POSITION-ის მნიშვნელობების განმარტება
   ========================================== 
 
  position: static;
  - ეს არის ელემენტის ნაგულისხმევი (default) მდგომარეობა.
  - ელემენტი განლაგდება გვერდის ჩვეულებრივი ნაკადის (flow) მიხედვით.
  - მასზე top, bottom, left, right და z-index თვისებები არ მოქმედებს.


  position: relative;
  - ელემენტი ინარჩუნებს თავის ადგილს გვერდის ჩვეულებრივ ნაკადში, 
    მაგრამ საშუალებას გაძლევს გადააადგილო ის თავისი თავდაპირველი პოზიციიდან.
  - ასევე, ის ხდება "ორიენტირი" (მშობელი) შიგნით არსებული position: absolute 
    ელემენტებისთვის.

 
  position: absolute;
  - ელემენტი სრულად ამოვარდება გვერდის ჩვეულებრივი ნაკადიდან და ადგილს 
    არ ინარჩუნებს (სხვა ელემენტები ისე მოიქცევიან, თითქოს ეს ელემენტი არც არსებობს).
  - ის პოზიციონირებს უახლოესი position: relative (ან სხვა არასტატიკური) 
    მშობელი ელემენტის მიმართ. თუ ასეთი მშობელი არ აქვს, ეყრდნობა ბრაუზერ ფანჯარას (body).

 
   2) TOP, BOTTOM, LEFT, RIGHT-ის დანიშნულება
   ========================================== 

 
  top, bottom, left, right თვისებები გამოიყენება ელემენტის ზუსტი 
  ადგილმდებარეობის (კოორდინატების) განსაზღვრისთვის.

  - top: საზღვრავს დაშორებას ზედა კიდიდან.
  - bottom: საზღვრავს დაშორებას ქვედა კიდიდან.
  - left: საზღვრავს დაშორებას მარცხენა კიდიდან.
  - right: საზღვრავს დაშორებას მარჯვენა კიდიდან.

  შენიშვნა: ეს თვისებები მუშაობს მხოლოდ მაშინ, როცა ელემენტს 
  მითითებული აქვს position: relative, absolute, fixed ან sticky 
  (position: static-ის დროს არ მუშაობს).
