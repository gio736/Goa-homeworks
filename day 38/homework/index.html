<!-- ==================================================
2. FLEXBOX (Flexible Box Layout)
==================================================
Flexbox არის CSS layout მოდელი, რომელიც გამოიყენება ელემენტების ერთ განზომილებაში 
(მწკრივად ან სვეტად) ეფექტურად განთავსების, გასწორებისა და სივრცის გადანაწილებისთვის.

- flex-direction: განსაზღვრავს მთავარი ღერძის (Main Axis) მიმართულებას.
  * row: ელემენტები ლაგდება ჰორიზონტალურად (მარცხნიდან მარჯვნივ).
  * column: ელემენტები ლაგდება ვერტიკალურად (ზემოდან ქვემოთ).

- justify-content: ალაგებს ელემენტებს მთავარი ღერძის (Main Axis) გასწვრივ.
  * flex-start, flex-end, center, space-between, space-around, space-evenly.

- align-items: ალაგებს ელემენტებს მეორადი ღერძის (Cross Axis) გასწვრივ.
  * stretch, flex-start, flex-end, center.

- gap: ადგენს დაშორებას (M-სა და P-ს გარეშე) Flex კონტეინერის შვილობილ ელემენტებს შორის. -->
